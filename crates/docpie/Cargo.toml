[package]
name = "docpie"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
axum-login = "0.18.0"
chrono = { version = "0.4.42", features = [
    "serde"
] }
clap = "4.5.48"
mimalloc = "0.1.47"
password-auth = "1.0.0"
serde = { version = "1.0.228", features = [
    "derive"
] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "chrono",
    "runtime-tokio"
] }
strum = { version = "0.27.2", features = [
    "derive"
] }
thiserror = "2.0.17"
tokio = { version = "1.45.1", features = [
    "rt",
    "rt-multi-thread",
    "parking_lot",
    "net",
    "signal"
] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = [
    "trace",
    "timeout",
    "cors",
    "normalize-path",
    "async-compression",
    "catch-panic",
    "compression-full"
] }
# tower-sessions-sqlx-store = { version = "0.15.0", features = [
#     "postgres"
# ] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
validator = { version = "0.20.0", features = [
    "derive"
] }
