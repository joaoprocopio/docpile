[package]
name = "docpie"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = [
    "macros"
] }
axum-login = "0.18.0"
clap = "4.5.48"
futures = "0.3.31"
http-body-util = "0.1.2"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.10", features = ["client-legacy", "http1", "tokio"] }
mimalloc = "0.1.47"
password-auth = "1.0.0"
serde = { version = "1.0.228", features = [
    "derive"
] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio"
] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde"] }
tokio = { version = "1.45.1", features = [
    "rt",
    "rt-multi-thread",
    "parking_lot",
    "net",
    "time",
    "signal",
    "io-util"
] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = [
    "trace",
    "timeout",
    "cors",
    "normalize-path",
    "async-compression",
    "catch-panic",
    "compression-full"
] }
tower-sessions-sqlx-store = { version = "0.15.0", features = [
    "postgres"
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
validator = { version = "0.20.0", features = [
    "derive"
] }
