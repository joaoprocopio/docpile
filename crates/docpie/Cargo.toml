[package]
name = "docpie"
version = "0.1.0"
edition = "2024"

[features]
dev = ["dep:reqwest"]
prod = ["dep:mime"]

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = [
    "macros"
] }
axum-login = "0.18.0"
futures = "0.3.31"
mimalloc = "0.1.47"
mime = { version = "0.3.17", optional = true }
password-auth = "1.0.0"
reqwest = { version = "0.12.24", optional = true }
serde = { version = "1.0.228", features = [
    "derive"
] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "uuid"
] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = [
    "serde"
] }
tokio = { version = "1.45.1", features = [
    "rt",
    "rt-multi-thread",
    "parking_lot",
    "net",
    "time",
    "signal",
    "io-util"
] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = [
    "trace",
    "timeout",
    "cors",
    "normalize-path",
    "async-compression",
    "catch-panic",
    "compression-full",
    "fs"
] }
tower-sessions-sqlx-store = { version = "0.15.0", features = [
    "postgres"
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = "1.18.1"
validator = { version = "0.20.0", features = [
    "derive"
] }
