services:
    postgres:
        image: "postgres:18.0"
        ports:
            - "5432:5432"
        volumes:
            - "postgres:/var/lib/postgresql/data"
        environment:
            POSTGRES_DB: "${POSTGRES_DB:-postgres}"
            POSTGRES_USER: "${POSTGRES_USER:-postgres}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-d",
                    "${POSTGRES_DB:-postgres}",
                    "-U",
                    "${POSTGRES_USER:-postgres}",
                ]
            interval: "10s"
            timeout: "5s"
            retries: "5"
        restart: always

volumes:
    postgres:
