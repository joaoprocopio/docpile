[package]
name = "docpie"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
mimalloc = "0.1.47"
socket2 = "0.6.0"
tokio = { version = "1.45.1", features = [
    "rt",
    "net",
    "signal"
] }
tower-http = { version = "0.6.6", features = [
    "trace",
    "timeout",
    "cors",
    "normalize-path",
    "async-compression",
    "compression-full"
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
